name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, tipos, migrations, testes)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dataflow
          POSTGRES_PASSWORD: dataflow
          POSTGRES_DB: dataflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dataflow -d dataflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://dataflow:dataflow@localhost:5432/dataflow_test
      TEST_DATABASE_URL: postgresql+psycopg://dataflow:dataflow@localhost:5432/dataflow_test
    steps:
      - uses: actions/checkout@v7
      # setup-uv não publica tag flutuante de major: exige a versão completa.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
      - run: uv sync --frozen
      - name: Formatação
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Tipos (mypy estrito)
        run: uv run mypy app
      - name: Migrations em banco descartável (upgrade → check → downgrade → upgrade)
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Testes (PostgreSQL real)
        run: uv run pytest -q --cov=app --cov-report=term-missing:skip-covered
      # Mesmo critério do `pnpm audit --prod`: só o que vai para a imagem (o Dockerfile roda
      # `uv sync --frozen --no-dev`), com os marcadores avaliados como no contêiner (Linux,
      # CPython 3.13). Qualquer vulnerabilidade conhecida, ou pacote que não dê para auditar
      # (--strict), falha o job. Fica por último para não esconder o resultado dos testes.
      - name: Auditoria das dependências Python (pip-audit, base OSV)
        run: |
          requirements="$RUNNER_TEMP/requirements-audit.txt"
          uv export --quiet --frozen --no-dev --no-emit-project --format requirements.txt \
            --output-file "$requirements"
          packages="$(grep -cE '^[A-Za-z0-9]' "$requirements")"
          echo "$packages pacotes travados no uv.lock (sem os de desenvolvimento)"
          [[ "$packages" -gt 0 ]]
          uvx --python 3.13 pip-audit@2.10.1 --requirement "$requirements" --disable-pip \
            --strict --vulnerability-service osv --aliases on --progress-spinner off

  frontend:
    name: Frontend (formatação, lint, tipos, testes, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Só `dependencies` (e `optionalDependencies`), lidas do pnpm-lock.yaml: é o que vai no
      # bundle servido pelo Caddy; as de desenvolvimento só rodam no build e nos testes. Sem
      # --audit-level, qualquer aviso (a partir de "low") sai com código 1 e falha o job. Sem
      # --ignore-registry-errors, um erro do registro também falha, em vez de dar verde falso.
      # Fica por último para não esconder o resultado dos testes.
      - name: Auditoria das dependências de produção (pnpm audit --prod)
        run: pnpm audit --prod

  docker:
    name: Docker Compose + E2E (Playwright)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - name: Preparar o .env como no README
        # A suíte E2E cria mais de 10 contas a partir do mesmo IP em poucos minutos;
        # fora da CI o limite de cadastro continua em 10 por hora.
        run: |
          cp .env.example .env
          sed -i "s|^REGISTER_LIMIT_PER_HOUR=.*|REGISTER_LIMIT_PER_HOUR=100|" .env
          grep -qx "REGISTER_LIMIT_PER_HOUR=100" .env
      - name: Validar o arquivo Compose
        run: docker compose config --quiet
      - name: Build e subida do ambiente completo
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Health check pela borda (Caddy → API → Postgres/Redis/MinIO)
        run: curl --fail --silent http://localhost:8080/health/ready
      - name: Gerar arquivo de 100 mil linhas (acima do limite geral de 2 MB do proxy)
        run: python3 scripts/generate_samples.py --rows 100000 --only vendas
      - name: Registrar o ambiente das medições
        run: |
          nproc
          free -h
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: E2E
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:8080
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test
      - name: Logs sem tokens nem e-mails (o E2E passou por convite e redefinição de senha)
        run: |
          docker compose logs --no-color web >web.log
          docker compose logs --no-color api worker beat >app.log
          grep -q 'token=REDACTED' web.log
          if grep -nE 'token=[A-Za-z0-9_-]{16,}' web.log app.log; then
            echo "token de convite ou de redefinição no log"; exit 1
          fi
          if grep -nE '[A-Za-z0-9._%+-]+@example\.com' web.log app.log; then
            echo "e-mail no log"; exit 1
          fi
      - name: Logs dos contêineres em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail 300
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Encerrar ambiente
        if: always()
        run: docker compose down --volumes

  docker-prod:
    name: Compose de produção + E2E (HTTPS)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    env:
      COMPOSE_FILE: docker-compose.prod.yml
    steps:
      - uses: actions/checkout@v7
      - name: Preparar o .env como em docs/deploy.md
        # "localhost" faz o Caddy emitir o certificado pela própria CA interna:
        # exercita HTTPS sem depender de um domínio público.
        run: |
          set_env() { sed -i "s|^$1=.*|$1=$2|" .env; }
          cp .env.example .env
          set_env SITE_ADDRESS localhost
          set_env SECRET_KEY "$(openssl rand -hex 32)"
          set_env POSTGRES_PASSWORD "$(openssl rand -hex 16)"
          set_env REDIS_PASSWORD "$(openssl rand -hex 16)"
          set_env MINIO_ROOT_PASSWORD "$(openssl rand -hex 16)"
          set_env SMTP_HOST ""
          # Mesmo motivo do job de desenvolvimento: a suíte E2E cria mais de 10 contas.
          set_env REGISTER_LIMIT_PER_HOUR 100
          grep -qx "REGISTER_LIMIT_PER_HOUR=100" .env
      - name: Validar o arquivo Compose
        run: docker compose config --quiet
      - name: Build e subida do ambiente completo
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: API responde em HTTPS pela borda
        run: >-
          curl --fail --silent --show-error --insecure --retry 20 --retry-delay 2
          --retry-all-errors https://localhost/health/ready
      - name: HTTP redireciona para HTTPS
        run: |
          redirect="$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' http://localhost/)"
          echo "$redirect"
          [[ "$redirect" == 308\ https://localhost/* ]]
      - name: Cookies marcados como Secure
        run: curl --silent --insecure --include https://localhost/api/v1/auth/csrf | grep -iE '^set-cookie:\s*df_csrf=.*;\s*secure'
      - name: Só a borda fica exposta
        run: |
          for port in 5432 6379 8000 8025 8080 9000 9001; do
            if timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/$port" 2>/dev/null; then
              echo "A porta $port não deveria estar exposta"
              exit 1
            fi
          done
      - name: Redis exige senha
        run: |
          reply="$(docker compose exec -T redis redis-cli ping 2>&1 || true)"
          echo "$reply"
          grep -q NOAUTH <<<"$reply"
      - name: Banco, Redis e MinIO sem saída para a internet
        run: |
          for service in postgres redis; do
            docker compose exec -T "$service" sh -c 'command -v wget'  # a ferramenta existe
            if docker compose exec -T "$service" wget -q -T 5 -O /dev/null http://example.com; then
              echo "$service alcança a internet"; exit 1
            fi
          done
          # Controle positivo: a API (atrás do Caddy) tem uma segunda rede, com saída.
          docker compose exec -T api python -c "import socket; socket.create_connection(('example.com', 80), 5)"
      - name: HSTS e documentação da API desligada em produção
        run: |
          curl --silent --insecure --include https://localhost/ | grep -iE '^strict-transport-security: max-age=31536000'
          [[ "$(curl --silent --insecure --output /dev/null --write-out '%{http_code}' https://localhost/api/openapi.json)" == 404 ]]
      - name: Gerar arquivo de 100 mil linhas (acima do limite geral de 2 MB do proxy)
        run: python3 scripts/generate_samples.py --rows 100000 --only vendas
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: e2e/pnpm-lock.yaml
      - name: E2E
        working-directory: e2e
        env:
          E2E_BASE_URL: https://localhost
          E2E_IGNORE_HTTPS_ERRORS: "1"
          E2E_MAILPIT_URL: ""
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          pnpm test
      - name: Logs dos contêineres em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail 300
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-prod
          path: e2e/playwright-report
          retention-days: 7
      - name: Backup, destruição dos volumes e restauração (docs/deploy.md)
        run: |
          counts() {
            docker compose exec -T postgres sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA' <<'SQL'
          SELECT (SELECT count(*) FROM users), (SELECT count(*) FROM datasets),
                 (SELECT count(*) FROM dataset_versions), (SELECT count(*) FROM uploads),
                 (SELECT count(*) FROM export_jobs), (SELECT count(*) FROM audit_logs);
          SQL
          }
          before="$(counts)"
          echo "antes do backup: $before"
          bash scripts/backup.sh backup-ci
          docker compose down --volumes
          docker compose up --detach --wait --wait-timeout 300
          fresh="$(counts)"
          echo "instalação nova: $fresh"
          [[ "$fresh" != "$before" ]]
          bash scripts/restore.sh backup-ci || [[ $? == 2 ]]  # sem --yes: não altera nada
          [[ "$(counts)" == "$fresh" ]]
          bash scripts/restore.sh backup-ci --yes
          after="$(counts)"
          echo "depois da restauração: $after"
          [[ "$after" == "$before" ]]
          curl --fail --silent --insecure https://localhost/health/ready
      - name: Logs dos contêineres em caso de falha do backup
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Encerrar ambiente
        if: always()
        run: docker compose down --volumes

  benchmark:
    name: Benchmark (1 milhão de linhas, XLSX de ~25 MB, exportações nos limites)
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.6"
      - name: Preparar o .env como no README
        run: cp .env.example .env
      - name: Build e subida do ambiente completo
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Gerar os arquivos (seed 42, determinísticos)
        run: |
          python3 scripts/generate_samples.py --rows 1000000 500000 100000 --only vendas
          uv run --no-project --with openpyxl==3.1.5 python scripts/generate_samples.py --xlsx --rows 280000
          ls -l samples/generated
      - name: Registrar o ambiente das medições
        run: |
          nproc
          free -h
          docker compose exec -T worker sh -c 'cat /sys/fs/cgroup/memory.max /sys/fs/cgroup/cpu.max' || true
      - name: Benchmark pela API
        run: >-
          python3 scripts/benchmark_stack.py --base-url http://localhost:8080
          --large samples/generated/vendas_1000000.csv
          --csv-limit samples/generated/vendas_500000.csv
          --xlsx-limit samples/generated/vendas_100000.csv
          --workbook samples/generated/vendas_atendimentos_280000.xlsx
          --work "$RUNNER_TEMP/benchmark" --out benchmark-stack.json
      - name: Pico de memória dos contêineres (cgroup)
        if: always()
        run: |
          for service in worker api; do
            peak="$(docker compose exec -T "$service" cat /sys/fs/cgroup/memory.peak 2>/dev/null || echo indisponível)"
            echo "$service: $peak bytes"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: benchmark-stack
          path: benchmark-stack.json
          retention-days: 30
      - name: Logs dos contêineres em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Encerrar ambiente
        if: always()
        run: docker compose down --volumes
