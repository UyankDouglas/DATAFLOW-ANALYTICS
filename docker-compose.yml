# Ambiente completo de desenvolvimento/demonstração.
#   docker compose up --build        → http://localhost:8080
# Portas de infraestrutura são publicadas apenas para desenvolvimento local.

name: dataflow

x-backend: &backend
  build:
    context: .
    dockerfile: docker/api/Dockerfile
    target: runtime
  image: dataflow-backend:dev
  env_file:
    - path: .env
      required: false
  environment: &backend-env
    ENVIRONMENT: ${ENVIRONMENT:-development}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-dataflow}:${POSTGRES_PASSWORD:-dataflow}@postgres:5432/${POSTGRES_DB:-dataflow}
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT_URL: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:-dataflow}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dataflow-secret}
    S3_BUCKET: ${S3_BUCKET:-dataflow}
    SECRET_KEY: ${SECRET_KEY:-dev-insecure-secret-change-me}
    APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080,http://localhost:5173}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    # Fixos: o SMTP_HOST do .env de exemplo aponta para localhost (execução fora do Docker).
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    MAX_CSV_MB: ${MAX_CSV_MB:-100}
    MAX_XLSX_MB: ${MAX_XLSX_MB:-25}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dataflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataflow}
      POSTGRES_DB: ${POSTGRES_DB:-dataflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.8-alpine
    # Broker do Celery: nunca descartar chaves por pressão de memória.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # A imagem do MinIO roda como usuário não-root (65532); ajusta o volume uma única vez.
  minio-perms:
    image: busybox:1.37
    command: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes:
      - miniodata:/data
    restart: "no"

  minio:
    # MinIO Community foi arquivado em 2026; a Chainguard mantém builds atualizados e gratuitos.
    # Ver docs/decisions.md (ADR-006). Sobrescreva com MINIO_IMAGE para fixar um digest.
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dataflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dataflow-secret}
    volumes:
      - miniodata:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    depends_on:
      minio-perms:
        condition: service_completed_successfully

  # Imagem distroless do MinIO não tem shell para healthcheck: o setup aguarda o
  # serviço responder pela API S3 e cria o bucket privado.
  storage-setup:
    <<: *backend
    command: ["python", "-m", "app.scripts.init_storage"]
    restart: "no"
    depends_on:
      minio:
        condition: service_started

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.32
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  worker:
    <<: *backend
    command:
      ["celery", "-A", "app.tasks.celery_app", "worker", "-Q", "default,imports",
       "--concurrency", "${WORKER_CONCURRENCY:-2}", "--loglevel", "INFO", "-n", "worker@%h"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      storage-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d worker@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-2}"
          memory: ${WORKER_MEMORY:-2g}
    restart: unless-stopped

  beat:
    <<: *backend
    command: ["celery", "-A", "app.tasks.celery_app", "beat", "--loglevel", "INFO",
              "--schedule", "/var/lib/dataflow/celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: dataflow-web:dev
    environment:
      MAX_UPLOAD_BODY: ${MAX_UPLOAD_BODY:-110MB}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
